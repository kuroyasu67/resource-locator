name: CI

# ビルド・テスト・リントの結果に影響するファイルを変更したときだけ実行する
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      # lib.rsで`include_str!`によりドキュメントへ取り込み、doctestの対象になる
      - "README.md"
      - "Cargo.lock"
      # Cargo.toml、deny.toml、taplo.toml、rustfmt.toml、clippy.tomlなど
      - "**/*.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "README.md"
      - "Cargo.lock"
      - "**/*.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチやPRで新しい実行が始まったら、古い実行をキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stableとCargo.tomlのrust-version（MSRV）で検証
        toolchain: [stable, "1.100.0"]
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          if [ "${{ matrix.features }}" = "all-features" ]; then
            cargo test --locked --all-targets --all-features
            cargo test --locked --doc --all-features
          else
            cargo test --locked --all-targets
            cargo test --locked --doc
          fi

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - run: taplo fmt --check
