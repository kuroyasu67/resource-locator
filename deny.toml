# Configuration file for `cargo-deny`.
# See https://embarkstudios.github.io/cargo-deny/ for more information.

[graph]
# cargo-denyは、他のジョブと同じく、すべてのフィーチャーで有効になる依存クレートを検査する。
all-features = true

[advisories]
version = 2
yanked  = "deny"
# 例外とする勧告。理由と、例外を外す条件を記述し、条件を満たしたら削除する。
ignore = []

[licenses]
version = 2
# 依存クレートが実際に使用しているライセンスのみを許可する。
allow                = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[licenses.private]
# 公開しない（publish = false）クレートはライセンス検査の対象外とする。
ignore = true

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# 版を記述しないパスの依存は許可する。
allow-wildcard-paths = true

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
# Gitのリポジトリから取得する依存は使わない。
allow-git = []
