[package]
name         = "resource-locator"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.100.0"
description  = "Parse and validate resource location strings such as gs://, local://, sm:// and env://"
readme       = "README.md"
repository   = "https://github.com/kuroyasu67/resource-locator"
license      = "MIT OR Apache-2.0"
keywords     = ["gcp", "cloud-storage", "secret-manager", "config", "uri"]
categories   = ["config", "parser-implementations"]
include      = ["src/**/*.rs", "README.md", "LICENSE-*"]
publish      = true

[features]
# `FileLocation`と`SecretLocation`に`serde::Deserialize`を実装する
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.229", default-features = false, features = [
  "std",
], optional = true }
thiserror = "2.0.21"

[dev-dependencies]
rstest = "0.29.0"

[lints.rust]
missing_docs          = "warn"
unsafe_code           = "forbid"
unreachable_pub       = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
