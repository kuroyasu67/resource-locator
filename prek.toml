# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# 最初に失敗したフックで残りをスキップ
fail_fast = true
# stages未指定のフックはpre-commitでのみ実行
default_stages = ["pre-commit"]
# `prek install`でpre-commitとpre-pushの両方のGitフックを登録
default_install_hook_types = ["pre-commit", "pre-push"]
# 除外するパス
exclude = { glob = ["target/**"] }

[[repos]]
hooks = [
  # 行末の空白文字を除去
  { id = "trailing-whitespace" },
  # ファイルの末尾に改行を挿入
  { id = "end-of-file-fixer" },
  # サイズの大きいファイルを確認
  { id = "check-added-large-files" },
  # ファイル先頭のUTF-8 BOMを除去
  { id = "fix-byte-order-marker" },
  # マージによるコンフリクトを解消していないコミットを防止
  { id = "check-merge-conflict" },
  # 大文字小文字を区別しないファイルシステムで衝突する名前を検出
  { id = "check-case-conflict" },
  # 異なる改行コードを検出し、LFに変換
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  # 秘密鍵を検出
  { id = "detect-private-key", exclude = "^resources/tests/" },
]
repo = "builtin"

[[repos]]
repo = "local"

[[repos.hooks]]
entry          = "cargo fmt --all -- --check"
id             = "cargo-fmt"
language       = "system"
name           = "cargo fmt"
pass_filenames = false
types          = ["rust"]

[[repos.hooks]]
entry          = "cargo clippy --all-targets --all-features -- -D warnings"
id             = "cargo-clippy"
language       = "system"
name           = "cargo clippy"
pass_filenames = false
types          = ["rust"]

[[repos.hooks]]
always_run     = true
entry          = "cargo deny check"
id             = "cargo-deny"
language       = "system"
name           = "cargo deny check"
pass_filenames = false

[[repos.hooks]]
entry    = "taplo fmt"
id       = "taplo-fmt"
language = "system"
name     = "taplo fmt"
types    = ["toml"]
